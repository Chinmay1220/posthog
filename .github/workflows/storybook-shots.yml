name: storybook-shots

# One-off check for the posthog-ai-copy-markdown branch: lint and format, a static Storybook build of
# the two stories that show the answer footers, screenshots plus a clipboard check of each copy
# button, then the frontend typecheck. Lives on its own orphan branch so none of PostHog's
# workflows run here.
on:
    push:
        branches: [storybook-shots]

permissions:
    contents: read

jobs:
    shots:
        runs-on: ubuntu-latest
        timeout-minutes: 120
        env:
            CHANGED: >-
                frontend/src/scenes/max/messages/SuccessActions.tsx
                frontend/src/scenes/max/messages/quill/QuillSuccessActions.tsx
                products/posthog_ai/frontend/components/quill/QuillFooterButton.tsx
                products/posthog_ai/frontend/components/TurnFeedbackActions.tsx
                products/posthog_ai/frontend/components/quill/QuillTurnFeedbackActions.tsx
        steps:
            - uses: actions/checkout@v4
              with:
                  path: tools
            - uses: actions/checkout@v4
              with:
                  repository: Chinmay1220/posthog
                  ref: posthog-ai-copy-markdown
                  fetch-depth: 3
                  path: posthog
            - uses: actions/setup-node@v4
              with:
                  node-version-file: posthog/.nvmrc
            - name: Install
              working-directory: posthog
              run: |
                  mkdir -p /tmp/out /tmp/pw
                  git log --format="%h %s" -3
                  npm i -g pnpm@11.28.5
                  pnpm install --frozen-lockfile
            - name: Lint and format
              working-directory: posthog
              run: |
                  pnpm exec oxlint --quiet $CHANGED
                  pnpm exec oxfmt --check $CHANGED
            - name: Build Storybook
              working-directory: posthog
              timeout-minutes: 40
              env:
                  # Run 42920818304 covered the 2.0 footers (comparison and ThreadView stories) and the
                  # typecheck on this same commit; this run covers the LangGraph chat footers.
                  STORYBOOK_STORIES: frontend/src/scenes/max/MaxTools.stories.tsx,frontend/src/scenes/max/CopyMarkdownDemo.stories.tsx
              run: |
                  set -o pipefail
                  # Demo-only story, never committed: the finished SQL answer story in the quill skin.
                  cp "$GITHUB_WORKSPACE/tools/CopyMarkdownDemo.stories.tsx" frontend/src/scenes/max/
                  bin/turbo --filter=@posthog/storybook prepare 2>&1 | tail -15
                  pnpm --filter=@posthog/storybook build 2>&1 | tee /tmp/out/build.log | tail -40
                  jq -r '.entries | keys[]' common/storybook/dist/index.json
            - name: Screenshots and clipboard check
              working-directory: posthog
              timeout-minutes: 30
              run: |
                  nohup pnpm --filter=@posthog/storybook exec http-server dist --port 6006 --silent >/tmp/out/http.log 2>&1 &
                  for _ in $(seq 1 60); do curl -sf http://localhost:6006/index.json >/dev/null && break; sleep 1; done
                  curl -sf http://localhost:6006/index.json >/dev/null
                  # The repo root depends on playwright, so the script resolves that copy from here, and
                  # drives the runner's own Chrome: no browser download.
                  google-chrome --version
                  cp "$GITHUB_WORKSPACE/tools/shot.mjs" ./shot.mjs
                  node -e "console.log('playwright', require('playwright/package.json').version)" || true
                  SHOT_SET=legacy PW_CHANNEL=chrome timeout 1500 node shot.mjs
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: storybook-shots
                  path: /tmp/out
