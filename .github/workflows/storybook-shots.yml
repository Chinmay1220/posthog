name: storybook-shots

# One-off demo for the posthog-ai-copy-markdown branch: a static Storybook build of the stories that
# show the PostHog AI answer footers, built once from the base commit (before) and once from the
# branch (after), with screenshots of each footer and, for the branch, a clipboard check of every
# copy button. Run 42920818304 ran lint, format and the typecheck on the same branch commit. Lives on
# its own orphan branch so none of PostHog's workflows run here.
on:
    push:
        branches: [storybook-shots]

permissions:
    contents: read

jobs:
    shots:
        strategy:
            fail-fast: false
            matrix:
                variant: [before, after]
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4
              with:
                  path: tools
            - uses: actions/checkout@v4
              with:
                  repository: Chinmay1220/posthog
                  # before: the branch's merge base on master. after: the branch head.
                  ref: ${{ matrix.variant == 'before' && '7f24894b5327859a231ed01e5992f75b31e164eb' || 'posthog-ai-copy-markdown' }}
                  path: posthog
            - uses: actions/setup-node@v4
              with:
                  node-version-file: posthog/.nvmrc
            - name: Install
              working-directory: posthog
              run: |
                  mkdir -p /tmp/out
                  git log --format="%h %s" -1
                  npm i -g pnpm@11.28.5
                  pnpm install --frozen-lockfile
            - name: Build Storybook
              working-directory: posthog
              timeout-minutes: 40
              env:
                  STORYBOOK_STORIES: frontend/src/scenes/max/PostHogAiQuillComparison.stories.tsx,products/posthog_ai/frontend/components/ThreadView.stories.tsx,frontend/src/scenes/max/MaxTools.stories.tsx,frontend/src/scenes/max/CopyMarkdownDemo.stories.tsx
              run: |
                  set -o pipefail
                  # Demo-only story, never committed: the finished SQL answer story in the quill skin.
                  cp "$GITHUB_WORKSPACE/tools/CopyMarkdownDemo.stories.tsx" frontend/src/scenes/max/
                  bin/turbo --filter=@posthog/storybook prepare 2>&1 | tail -15
                  pnpm --filter=@posthog/storybook build 2>&1 | tee /tmp/out/build.log | tail -20
                  jq -r '.entries | keys[]' common/storybook/dist/index.json
            - name: Screenshots and clipboard check
              working-directory: posthog
              timeout-minutes: 30
              run: |
                  nohup pnpm --filter=@posthog/storybook exec http-server dist --port 6006 --silent >/tmp/out/http.log 2>&1 &
                  for _ in $(seq 1 60); do curl -sf http://localhost:6006/index.json >/dev/null && break; sleep 1; done
                  curl -sf http://localhost:6006/index.json >/dev/null
                  # The repo root depends on playwright, so the script resolves that copy from here, and
                  # drives the runner's own Chrome: no browser download.
                  cp "$GITHUB_WORKSPACE/tools/shot.mjs" ./shot.mjs
                  VARIANT=${{ matrix.variant }} PW_CHANNEL=chrome timeout 1500 node shot.mjs
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: shots-${{ matrix.variant }}
                  path: /tmp/out
